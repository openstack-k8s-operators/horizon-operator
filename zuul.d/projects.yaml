# DNM
---
# project template to be used locally for operator testing
- project-template:
    name: horizon-operator-s2i-testing
    github-check:
      jobs:
        - horizon-s2i-content-provider:
            voting: false
        - horizon-s2i-test:
            voting: false
            dependencies:
              - openstack-k8s-operators-content-provider
              - horizon-s2i-content-provider

# project template to be used in the s2i repository
- project-template:
    name: horizon-operator-s2i-component-jobs
    github-check:
      jobs:
        - horizon-s2i-test:
            vars:
              content_provider_registry_ip: "{{ s2i_content_provider_registry_ip }}"
            files:
              - ^containers/base/
              - ^containers/horizon/
              - ^containers/horizontest/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

- project:
    name: openstack-k8s-operators/horizon-operator
    templates:
      - horizon-operator-s2i-testing
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider:
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
        - horizon-operator-kuttl:
            dependencies:
              - openstack-k8s-operators-content-provider
            voting: false
