---
- job:
    name: horizon-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/horizon-operator
    irrelevant-files:
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
      - ^renovate.json$
    vars:
      cifmw_kuttl_tests_operator_list:
        - horizon

- job:
    name: horizon-operator-horizontest
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    description: |
      Deploy OpenStack with Horizon enabled and run horizontest UI tests
      via test-operator. Parent for horizon-s2i-horizontest.
    vars:
      cifmw_extras:
        - '@scenarios/centos-9/multinode-ci.yml'
        - '@scenarios/centos-9/hci_ceph_backends.yml'
        - '@scenarios/centos-9/horizon.yml'
      cifmw_run_tests: true
      cifmw_test_operator_timeout: 7200
      cifmw_test_operator_stages:
        - name: horizontest
          type: horizontest
      cifmw_test_operator_horizontest_auth_url: "https://keystone-public-openstack.apps-crc.testing"
      cifmw_test_operator_horizontest_dashboard_url: "https://horizon-openstack.apps-crc.testing/"
      cifmw_test_operator_horizontest_extra_flag: "not pagination and not test_regions"

- job:
    name: horizon-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i horizon and horizontest images for horizon-s2i-horizontest.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
    vars:
      s2i_ci_images:
        - horizon/horizon
        - horizontest/horizontest

- job:
    name: horizon-s2i-horizontest
    parent: horizon-operator-horizontest
    description: |
      Validate speculatively-built s2i horizon and horizontest images
      against a live OpenStack deployment. s2i-built horizon is applied
      to OpenStackVersion during edpm_prepare via ci-framework
      set_containers. The s2i horizontest image is pinned via
      cifmw_test_operator_* vars (test workload, not OpenStackVersion).
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
    vars:
      cifmw_crc_additional_insecure_registries:
        - "{{ s2i_content_provider_registry_ip }}:5001"
      cifmw_crc_additional_allowed_registries:
        - "{{ s2i_content_provider_registry_ip }}:5001"
      cifmw_set_containers_preserve_unlisted: true
      cifmw_set_containers_images: >-
        {{
          s2i_content_provider_os_custom_container_images | dict2items |
          json_query('[].{name: key, full_registry: value}')
        }}
      cifmw_test_operator_horizontest_registry: >-
        {{ s2i_content_provider_registry_ip }}:5001
      cifmw_test_operator_horizontest_namespace: "{{ s2i_ci_content.namespace }}"
      cifmw_test_operator_horizontest_container: openstack-horizontest
      cifmw_test_operator_horizontest_image_tag: "{{ s2i_ci_content.tag }}"
